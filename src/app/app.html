<a class="skip-link" href="#poster-title" (click)="skipToContent($event)">Skip to content</a>

<header class="bar">
  <h1 class="brand">voidbrain.net <span aria-hidden="true">//</span> {{ owner.name }}</h1>
  <span aria-hidden="true">{{ owner.role }}</span>
  <nav class="switcher" aria-label="Poster">
    @for (s of states; track s) {
      <button type="button" class="switch" [attr.aria-pressed]="s === state()" (click)="go(s)">
        {{ titles[s] }}
      </button>
    }
  </nav>
</header>
<div class="hazard" aria-hidden="true"></div>

<main class="stage" (pointerdown)="onPointerDown($event)" (pointerup)="onPointerUp($event)">
  <!-- the neighbouring posters peek in on wide screens; the switcher above is the accessible way to them -->
  <button
    type="button"
    class="side side--prev"
    tabindex="-1"
    aria-hidden="true"
    [attr.data-tone]="neighbours()[0]"
    (mousedown)="$event.preventDefault()"
    (click)="go(neighbours()[0])"
  >
    <span class="side__word">{{ posters[neighbours()[0]].back }}</span>
  </button>
  <div class="sheet" [attr.data-tone]="state()">
    <div class="figure">
      @defer (on idle; on timer(2500ms)) {
        <vb-self-model [state]="state()" />
      } @placeholder {
        <div class="figure-placeholder" role="img" [attr.aria-label]="poster().figure"></div>
      }
    </div>
    @for (s of [state()]; track s) {
      <vb-poster [state]="s" />
    }
  </div>
  <button
    type="button"
    class="side side--next"
    tabindex="-1"
    aria-hidden="true"
    [attr.data-tone]="neighbours()[1]"
    (mousedown)="$event.preventDefault()"
    (click)="go(neighbours()[1])"
  >
    <span class="side__word">{{ posters[neighbours()[1]].back }}</span>
  </button>
  <p class="visually-hidden" aria-live="polite">{{ announcement() }}</p>
</main>

<div class="hazard" aria-hidden="true"></div>
<footer class="bar bar--bottom">
  <button type="button" class="switch" (click)="step(-1)">
    <span aria-hidden="true">←</span> <span class="visually-hidden">Previous poster</span>
  </button>
  <span>← → or swipe to switch // {{ owner.place }}</span>
  <button type="button" class="switch" (click)="step(1)">
    <span class="visually-hidden">Next poster</span> <span aria-hidden="true">→</span>
  </button>
</footer>
