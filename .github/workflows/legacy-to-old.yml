name: Copy the old site into old/

# One-off step before the first upload (F-007, docs/DESIGN.md "Deploy steps"): the current docroot, without old/,
# is downloaded to the runner and uploaded again into old/, where the old site keeps running. Nothing is deleted.
# Manual only, and copy needs the word "copy" typed in. The runner's copy is discarded; it is never an artifact.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'size: report the size first. copy: copy the old site into old/.'
        type: choice
        options: [size, copy]
        default: size
      confirm:
        description: 'For copy, type: copy'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ftps-host
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse copy without confirmation
        if: inputs.mode == 'copy' && inputs.confirm != 'copy'
        run: |
          echo "Type copy in the confirm field to run the copy." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: FTPS ${{ inputs.mode }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR }}
        run: tools/ftps.sh "${{ inputs.mode }}"
